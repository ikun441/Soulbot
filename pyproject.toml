[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soulbot"
dynamic = ["version"]
description = "可配置人格与社交行为的 QQ AI 平台"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "httpx>=0.28,<1",
  "nonebot2[fastapi,httpx,websockets]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3", "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13", "tzdata>=2025.1", "jsonschema>=4.23,<5", "playwright==1.64.1"
]

[tool.setuptools.dynamic]
version = {attr = "soulbot.__version__"}
[tool.setuptools.packages.find]
include = ["soulbot*"]
[tool.setuptools.package-data]
soulbot = ["web/static/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
